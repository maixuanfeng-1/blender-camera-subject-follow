name: Feature idea / 功能建议
description: Describe a Blender workflow that could be easier.
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / 想解决什么问题？
      description: Describe the scene/workflow and what currently takes too much work.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior / 希望的行为
    validations:
      required: true
